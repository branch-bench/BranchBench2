syntax = "proto3";

package microbench2;

// Built-in integrations selectable by the CLI. Embedding applications can
// supply a PreparedTarget instead. New integrations also work via --backend.
enum Backend {
  NEON = 0;
  DOLT = 1;
  XATA = 3;
  FILE_COPY = 4;
  DOLT_MYSQL = 7;
  SEEKDB = 8;
  MATRIXONE = 9;
  CHRONOS = 10;
  BAUPLAN = 11;
  TERMINUSDB = 12;
  
}

// Operation types for benchmarking
enum OperationType {
  // CRUD operations
  READ = 0;
  INSERT = 1;
  UPDATE = 2;
  DELETE = 3;
  RANGE_READ = 4;
  RANGE_UPDATE = 5;

  // Branch operations
  BRANCH_CREATE = 10;
  BRANCH_CONNECT = 11;
  BRANCH_DELETE = 12;
  // The remaining git-like verbs. Each timed op runs on a state prepared
  // untimed (see BranchOpConfig).
  BRANCH_COMMIT = 13;
  BRANCH_DIFF = 14;
  BRANCH_LOG = 15;
  BRANCH_MERGE = 16;
  BRANCH_REBASE = 17;
  BRANCH_REVERT = 18;
  BRANCH_RESET = 19;

  // DDL operations (extensible)
  DDL_ADD_INDEX = 20;
  DDL_REMOVE_INDEX = 21;
  DDL_ADD_COLUMN = 22;
  DDL_REMOVE_COLUMN = 23;
  DDL_VACUUM = 24;
  DDL_BACKFILL = 25;
  DDL_ADD_COLUMN_WITH_DEFAULT = 26;
  DDL_TYPE_CHANGE = 27;
  DDL_RENAME_COLUMN = 28;
  DDL_RENAME_TABLE = 29;
  DDL_ADD_FK = 30;
  DDL_ADD_CHECK = 31;
  DDL_SET_DEFAULT = 32;
  DDL_SET_NOT_NULL = 33;
  DDL_EXPAND_CONTRACT = 34;
}

// Branch tree shapes for setup phase
enum BranchShape {
  SPINE = 0;    // Linear chain: each branch from previous
  FAN_OUT = 1;  // All branches from root
  BUSHY = 2;    // Random parent selection
}

// Attach to an existing database instead of creating a new one.
message ExistingDatabase {
  string branch_id = 1;
  string neon_project_id = 2;
}

// SQL dump file for database initialization
message SqlDump {
  string sql_dump_path = 1;
}

// The CLI owns database setup and cleanup. Prepared-target execution does not.
message DatabaseSetup {
  string db_name = 1;
  bool cleanup = 2;  // Whether to cleanup after benchmark

  // Source: either existing database or SQL dump
  oneof source {
    ExistingDatabase existing_db = 3;
    SqlDump sql_dump = 4;
  }
}

// Range operation configuration (for RANGE_READ, RANGE_UPDATE)
message RangeConfig {
  int32 range_size = 1;  // Number of rows in range
}

// Setup phase configuration (UNTIMED)
message SetupConfig {
  int32 num_branches = 1;
  BranchShape branch_shape = 2;

  // Data operations to perform during setup (per branch)
  int32 inserts_per_branch = 3;
  int32 updates_per_branch = 4;
  int32 deletes_per_branch = 5;
}

// DDL operation specific configuration
message DdlConfig {
  string index_column_name = 1;  // For ADD_INDEX operations
  string column_name = 2;         // For ADD_COLUMN/REMOVE_COLUMN
  string column_type = 3;         // For ADD_COLUMN (e.g., "VARCHAR(100)")
  float backfill_fraction = 4;    // For BACKFILL: fraction of the table's rows to rewrite (0.0-1.0)
  string default_value = 5;       // For ADD_COLUMN_WITH_DEFAULT: the default value expression.
  string new_column_name = 6;   // for RENAME_COLUMN
  string new_table_name = 7;    // for RENAME_TABLE
  string ref_table_name = 8;    // for ADD_FK, the table being referenced
  string ref_column_name = 9;   // for ADD_FK, the column being referenced
  string check_expression = 10; // for ADD_CHECK, e.g. "quantity > 0"
}

// Configuration for the git-like verbs (BRANCH_COMMIT .. BRANCH_RESET)
message BranchOpConfig {
  // Rows inserted (untimed) into each side the verb then works on: the
  // commit's working set, the child a diff/merge/rebase carries, the
  // commit a revert undoes, the changes a reset discards. Default 1.
  int32 changes_per_op = 1;
  // Commits made (untimed) on the branch before BRANCH_LOG. Default 10.
  int32 history_commits = 2;
  // ``limit`` passed to log(). Default 10.
  int32 log_limit = 3;
}

// Single operation benchmark configuration
message OperationBenchmark {
  OperationType operation = 1;
  int32 num_ops = 2;  // Number of timed operations to execute
  int32 warmup_ops = 6;  // Number of warm-up operations (executed but not timed)

  // Setup phase configuration (UNTIMED)
  SetupConfig setup = 3;

  // Operation-specific configuration
  RangeConfig range_config = 4;  // For RANGE operations
  DdlConfig ddl_config = 5;      // For DDL operations
  BranchOpConfig branch_op_config = 7;  // For BRANCH_COMMIT .. BRANCH_RESET
}

// Main task configuration
message TaskConfig {
  string run_id = 1;
  optional Backend backend = 2;  // Presence prevents an implicit NEON default.
  string table_name = 3;
  DatabaseSetup database_setup = 4;

  // Scale factor (e.g., number of warehouses in TPCC schema)
  int32 scale_factor = 5;

  // field 6 removed (was autocommit; every statement now autocommits)
  int32 num_threads = 7;
  bool measure_storage = 8;

  // Async execution configuration
  // Number of concurrent requests per thread (default 1 = synchronous)
  // When > 1, enables async mode with that many concurrent requests, each on
  // its own connection from a per-thread pool of the same size
  int32 concurrent_requests = 10;

  // Run in async mode even with concurrent_requests = 1, so a sweep over
  // concurrent_requests uses the same runner and drivers at every point.
  // Async mode is always used when concurrent_requests > 1.
  bool use_async = 11;

  // Single operation benchmark configuration
  OperationBenchmark operation_benchmark = 9;
}
