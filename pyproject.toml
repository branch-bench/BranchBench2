[build-system]
# grpcio-tools 1.78.1 bundles protoc 31.1, so the generated *_pb2.py modules
# need the protobuf 6.31+ runtime pinned below. Change both together.
requires = ["setuptools>=61.0", "wheel", "grpcio-tools==1.78.1", "protobuf>=6.31.1,<7"]
build-backend = "setuptools.build_meta"

[project]
name = "db-fork"
version = "0.2.0"
description = "BranchBench benchmark engine, standalone CLIs, and database integrations."
authors = [{ name = "Elaine", email = "ra3448@columbia.edu" }]
requires-python = ">=3.11"
dependencies = [
    "faker>=37,<38",  # Generates benchmark rows; a new major can change the data
    "protobuf>=6.31.1,<7",  # The runtime of the *_pb2.py modules generated at build time
    "psycopg2-binary",  # util.import_db and util.db_helpers speak to Postgres-protocol servers
    "pymysql",  # util.db_helpers recognises MySQL-protocol connections
    "pyarrow>=22,<23",  # Writes result parquet files
    "tqdm",
    "aiomysql",  # Async exec on MySQL-protocol adapters
    "psycopg[binary]>=3.0",  # Chronos adapter
    "psycopg-pool",  # Async exec on Postgres-protocol adapters
    "requests",  # Hosted Neon and Xata adapters
    "sqlglot>=30.22.0",  # Chronos SQL handling
    "bauplan>=0.3.4",  # Bauplan provider SDK
    "duckdb>=1.5.6,<2",  # Local SQL execution for the Bauplan adapter
]

[project.optional-dependencies]
# scripts/plotting: analysis of finished runs, never needed to run a benchmark.
plotting = ["matplotlib", "numpy", "pandas>=2.3,<3", "scipy"]
chronos = [
    "chronos-core @ git+https://github.com/mitdbg/chronos@607418d4d06ba1a67be0e9e5a7617132f265a87c#subdirectory=packages/chronos-core",
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dblib*", "microbench*", "macrobench*", "util*", "db_setup*"]

[tool.setuptools.package-data]
dblib = ["*.proto", "systems/*/README.md", "systems/*/system.json", "systems/*/install", "systems/*/start", "systems/*/check", "systems/*/stop"]
microbench = ["*.proto", "*.textproto"]
macrobench = ["*.proto", "configs/*.textproto", "schema/*.sql"]
db_setup = ["*.sql", "*.sh"]

[tool.setuptools.cmdclass]
build_py = "build_protos.BuildWithProtos"

[tool.uv]
# The build step compiles the .proto files into the (untracked) *_pb2.py
# modules. Rebuild the project whenever a .proto file changes, not only when
# pyproject.toml does, so `uv sync` / `uv run` regenerate them.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "build_protos.py" },
    { file = "**/*.proto" },
]
